      case 'create':          screenEl = this.renderCreate(); break;
      case 'notif':           screenEl = this.renderNotif(); break;
      case 'profile':         screenEl = this.renderProfile(); break;
      case 'thread-detail':   screenEl = this.renderThreadDetail(); break;
      case 'node-vocab':      screenEl = this.renderNodeVocab(); break;
      case 'node-quiz':       screenEl = this.renderNodeQuiz(); break;
      case 'node-writing':    screenEl = this.renderNodeWriting(); break;
      case 'node-speaking':   screenEl = this.renderNodeSpeaking(); break;
      case 'node-discussion': screenEl = this.renderNodeDiscussion(); break;
      case 'node-fill':       screenEl = this.renderNodeFill(); break;
      case 'node-roleplay':   screenEl = this.renderNodeRoleplay(); break;
      case 'leaderboard':     screenEl = this.renderLeaderboard(); break;
      default:                screenEl = this.renderFeed();
    }

    const content = this.E('div',{key:s.screen,style:{position:'absolute',inset:0,display:'flex',flexDirection:'column',overflow:'hidden',background:'#fff',animation:'fadeUp 0.18s ease'}},
      screenEl,
      s.showEnroll ? this.renderEnrollModal() : null
    );

    // Bottom nav builder
    const clr = (tabId) => t===tabId?'#37352F':'#AEACA7';
    const NavItem = (tabId, label, paths) => this.E('div',{onClick:()=>this.goTab(tabId),style:{flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:2,padding:'4px 0',cursor:'pointer'}},
      this.E('svg',{width:22,height:22,viewBox:'0 0 24 24',fill:'none',stroke:clr(tabId),strokeWidth:t===tabId?2.5:1.8,strokeLinecap:'round',strokeLinejoin:'round'},...paths),
      this.E('span',{style:{fontSize:10,fontWeight:t===tabId?700:500,color:clr(tabId)}},label)
    );

    const unreadCount = this.notifications.filter(n=>!s.readNotifs.includes(n.id)&&!n.read).length;

    // Status bar icons
    const statusIcons = this.E('div',{style:{display:'flex',alignItems:'center',gap:6}},
      this.E('div',{style:{display:'flex',alignItems:'flex-end',gap:2}},
        ...[6,9,12,15].map((h,i)=>this.E('div',{key:i,style:{width:3,height:h,background:'#37352F',borderRadius:1}}))
      ),
      this.E('svg',{width:16,height:11,viewBox:'0 0 16 11',fill:'none'},
        this.E('path',{d:'M8 2.5C10.5 2.5 12.7 3.5 14.2 5.2',stroke:'#37352F',strokeWidth:1.5,strokeLinecap:'round'},''),
        this.E('path',{d:'M1.8 5.2C3.3 3.5 5.5 2.5 8 2.5',stroke:'#37352F',strokeWidth:1.5,strokeLinecap:'round'},''),
        this.E('path',{d:'M5.5 7.5C6.3 6.6 7.1 6 8 6s1.7.6 2.5 1.5',stroke:'#37352F',strokeWidth:1.5,strokeLinecap:'round'},''),
        this.E('circle',{cx:8,cy:9.5,r:1,fill:'#37352F'},'')
      ),
      this.E('div',{style:{display:'flex',alignItems:'center',gap:1}},
        this.E('div',{style:{width:24,height:12,border:'1.5px solid #37352F',borderRadius:2.5,padding:1.5,display:'flex',alignItems:'stretch'}},
          this.E('div',{style:{width:'82%',background:'#37352F',borderRadius:1}})
        ),
        this.E('div',{style:{width:2,height:5,background:'#37352F',borderRadius:'0 1px 1px 0'}})
      )
    );

    return {
      screenContent: content,
      statusIcons,

      navHome: NavItem('home','Home',[
        this.E('path',{key:'h1',d:'M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z',fill:t==='home'?'#37352F':'none'},''),
        this.E('polyline',{key:'h2',points:'9 22 9 12 15 12 15 22'},'')
      ]),

      navExplore: NavItem('explore','Explore',[
        this.E('circle',{key:'e1',cx:11,cy:11,r:8},''),
        this.E('line',{key:'e2',x1:21,y1:21,x2:16.65,y2:16.65},'')
      ]),

      navCreate: this.E('div',{onClick:()=>this.goTab('create'),style:{flex:1,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'flex-start',padding:'2px 0',cursor:'pointer'}},
        this.E('div',{style:{width:44,height:44,background:'#37352F',borderRadius:10,display:'flex',alignItems:'center',justifyContent:'center',boxShadow:'0 2px 8px rgba(55,53,47,0.2)'}},
          this.E('svg',{width:20,height:20,viewBox:'0 0 24 24',fill:'none',stroke:'#fff',strokeWidth:2.5,strokeLinecap:'round'},
            this.E('line',{x1:12,y1:5,x2:12,y2:19},''),this.E('line',{x1:5,y1:12,x2:19,y2:12},'')
          )
        )
      ),

      navNotif: this.E('div',{onClick:()=>this.goTab('notif'),style:{flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:2,padding:'4px 0',cursor:'pointer'}},
        this.E('div',{style:{position:'relative'}},
          this.E('svg',{width:22,height:22,viewBox:'0 0 24 24',fill:'none',stroke:clr('notif'),strokeWidth:t==='notif'?2.5:1.8,strokeLinecap:'round',strokeLinejoin:'round'},
            this.E('path',{d:'M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9'},''),
            this.E('path',{d:'M13.73 21a2 2 0 0 1-3.46 0'},'')
          ),
          unreadCount>0?this.E('div',{style:{position:'absolute',top:-1,right:-2,width:8,height:8,borderRadius:'50%',background:'#E53E3E',border:'1.5px solid #fff'}}):null
        ),
        this.E('span',{style:{fontSize:10,fontWeight:t==='notif'?700:500,color:clr('notif')}},'Inbox')
      ),

      navProfile: NavItem('profile','Me',[
        this.E('path',{key:'p1',d:'M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2'},''),
        this.E('circle',{key:'p2',cx:12,cy:7,r:4,fill:t==='profile'?'#37352F':'none'},'')
      ]),
    };
  }
}

</script>
